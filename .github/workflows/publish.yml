name: Publish to NPM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Install npm with trusted publishing support
      run: npm install --global npm@11.19.0
        
    - name: Install dependencies
      run: npm ci

    - name: Check whether version is already published
      id: version-check
      run: |
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "$PACKAGE_NAME@$CURRENT_VERSION is already published"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "$PACKAGE_NAME@$CURRENT_VERSION is not published yet"
        fi

    - name: Verify package contents
      if: steps.version-check.outputs.changed == 'true'
      run: npm pack --dry-run

    - name: Publish to NPM
      if: steps.version-check.outputs.changed == 'true'
      run: npm publish --access public
        
    - name: Create Git tag
      if: steps.version-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        TAG="v${{ steps.version-check.outputs.current }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "$TAG already exists"
        else
          git tag "$TAG"
          git push origin "$TAG"
        fi
        
    - name: Skip publishing
      if: steps.version-check.outputs.changed == 'false'
      run: echo "Skipping publish - version ${{ steps.version-check.outputs.current }} already published"
